<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>標案監控 — 標案瀏覽</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f4f8; color: #222; }

    nav { background: #1e3a5f; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 52px; }
    .nav-brand { color: #fff; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
    .nav-links a { color: #a8c4e0; text-decoration: none; margin-left: 24px; font-size: 14px; padding: 4px 0; border-bottom: 2px solid transparent; }
    .nav-links a:hover, .nav-links a.active { color: #fff; border-bottom-color: #4a9fd4; }

    main { max-width: 1200px; margin: 24px auto; padding: 0 16px; }

    .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .search-bar input { flex: 1; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; outline: none; }
    .search-bar input:focus { border-color: #1e3a5f; box-shadow: 0 0 0 3px rgba(30,58,95,.1); }
    .search-bar button { padding: 10px 20px; background: #1e3a5f; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; white-space: nowrap; }
    .search-bar button:hover { background: #2a4f7c; }

    .stats { font-size: 13px; color: #64748b; margin-bottom: 12px; }

    .table-wrap { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th { background: #1e3a5f; color: #fff; padding: 12px 16px; text-align: left; font-weight: 600; white-space: nowrap; }
    tbody tr { border-bottom: 1px solid #e2e8f0; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    tbody td { padding: 10px 16px; vertical-align: top; }
    .td-name { max-width: 360px; }
    .td-name a { color: #1e3a5f; text-decoration: none; font-weight: 500; }
    .td-name a:hover { text-decoration: underline; }
    .td-unit { max-width: 160px; color: #475569; font-size: 13px; }
    .td-date { white-space: nowrap; color: #64748b; font-size: 13px; }
    .td-method { font-size: 12px; color: #64748b; max-width: 120px; }
    .btn-watch { padding: 4px 10px; background: #e8f0fe; color: #1e3a5f; border: 1px solid #a8c4e0; border-radius: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    .btn-watch:hover { background: #1e3a5f; color: #fff; }

    .pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
    .pagination button { padding: 6px 14px; border: 1px solid #cbd5e1; border-radius: 6px; background: #fff; cursor: pointer; font-size: 14px; }
    .pagination button:hover:not(:disabled) { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
    .pagination button:disabled { color: #94a3b8; cursor: default; }
    .pagination .page-info { font-size: 14px; color: #64748b; }

    .msg { text-align: center; padding: 48px; color: #64748b; font-size: 15px; }
    .error { color: #dc2626; }
  </style>
</head>
<body>
<nav>
  <div class="nav-brand">標案監控</div>
  <div class="nav-links">
    <a href="index.html" class="active">標案瀏覽</a>
    <a href="watching.html">追蹤中</a>
    <a href="keywords.html">關鍵字</a>
  </div>
</nav>
<main>
  <div class="search-bar">
    <input type="text" id="search" placeholder="搜尋標案名稱、機關名稱…" oninput="onSearchInput()">
    <button onclick="doSearch()">搜尋</button>
  </div>
  <div class="stats" id="stats"></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>機關</th>
          <th>標案名稱</th>
          <th>招標方式</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
</main>

<script src="config.js"></script>
<script>
const PAGE_SIZE = 50;
const CACHE_TTL = 10 * 60 * 1000;
let allRows = [];
let filtered = [];
let currentPage = 1;

async function sheetsGet(range) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.SPREADSHEET_ID}/values/${encodeURIComponent(range)}?key=${CONFIG.GOOGLE_API_KEY}`;
  const r = await fetch(url);
  if (!r.ok) throw new Error(`Sheets API ${r.status}`);
  return (await r.json()).values || [];
}

async function cachedSheets(key, range) {
  const c = sessionStorage.getItem(key);
  if (c) {
    const {data, ts} = JSON.parse(c);
    if (Date.now() - ts < CACHE_TTL) return data;
  }
  const rows = await sheetsGet(range);
  sessionStorage.setItem(key, JSON.stringify({data: rows, ts: Date.now()}));
  return rows;
}

function rowToTender(r) {
  return { id: r[0]||'', name: r[1]||'', unit: r[2]||'', date: r[3]||'', category: r[4]||'', method: r[5]||'' };
}

function tenderUrl(id) {
  const pk = id.replace(/^TIQ-\d+-/, '');
  return `https://web.pcc.gov.tw/prkms/urlSelector/common/tpam?pk=${pk}`;
}

function renderRows(rows) {
  const tbody = document.getElementById('tbody');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="5" class="msg">查無資料</td></tr>'; return; }
  tbody.innerHTML = rows.map(t => `
    <tr>
      <td class="td-date">${t.date}</td>
      <td class="td-unit">${esc(t.unit)}</td>
      <td class="td-name"><a href="${tenderUrl(t.id)}" target="_blank" rel="noopener">${esc(t.name)}</a></td>
      <td class="td-method">${esc(t.method)}</td>
      <td><button class="btn-watch" data-t="${encodeURIComponent(JSON.stringify(t))}" onclick="addWatch(JSON.parse(decodeURIComponent(this.dataset.t)))">加入追蹤</button></td>
    </tr>`).join('');
}

function renderPagination() {
  const total = Math.ceil(filtered.length / PAGE_SIZE);
  const el = document.getElementById('pagination');
  if (total <= 1) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <button onclick="goPage(1)" ${currentPage===1?'disabled':''}>«</button>
    <button onclick="goPage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>
    <span class="page-info">第 ${currentPage} / ${total} 頁</span>
    <button onclick="goPage(${currentPage+1})" ${currentPage===total?'disabled':''}>›</button>
    <button onclick="goPage(${total})" ${currentPage===total?'disabled':''}>»</button>`;
}

function goPage(p) {
  currentPage = p;
  const start = (p-1)*PAGE_SIZE;
  renderRows(filtered.slice(start, start+PAGE_SIZE));
  renderPagination();
  window.scrollTo(0,0);
}

function doSearch() {
  const kw = document.getElementById('search').value.trim().toLowerCase();
  filtered = kw ? allRows.filter(t => t.name.toLowerCase().includes(kw) || t.unit.toLowerCase().includes(kw)) : [...allRows];
  currentPage = 1;
  document.getElementById('stats').textContent = `共 ${filtered.length.toLocaleString()} 筆`;
  goPage(1);
}

function onSearchInput() {
  if (!document.getElementById('search').value.trim()) doSearch();
}

function addWatch(t) {
  if (!CONFIG.APPS_SCRIPT_URL) { alert('Apps Script 尚未設定，請完成 Apps Script 計畫後填入 config.js 的 APPS_SCRIPT_URL。'); return; }
  fetch(CONFIG.APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({action:'add_watching', data: {id:t.id, name:t.name, unit:t.unit, date:t.date, category:t.category}})
  }).then(r=>r.json()).then(d => alert(d.success ? '已加入追蹤！' : '失敗：'+d.error));
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function init() {
  document.getElementById('tbody').innerHTML = '<tr><td colspan="5" class="msg">載入中…</td></tr>';
  try {
    const kwRows = await cachedSheets('kw', 'keywords');
    const kws = kwRows.slice(1).filter(r => (r[2]||'').toUpperCase()==='TRUE').map(r=>r[0]).join(' ');
    if (kws) document.getElementById('search').value = kws;

    const raw = await cachedSheets('raw', 'raw');
    allRows = raw.slice(1).map(rowToTender).filter(t=>t.id);
    filtered = [...allRows];
    document.getElementById('stats').textContent = `共 ${allRows.length.toLocaleString()} 筆`;
    goPage(1);
  } catch(e) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="5" class="msg error">載入失敗：${e.message}<br>請確認 API Key 已填入 config.js 且試算表已設為公開讀取。</td></tr>`;
  }
}

init();
</script>
</body>
</html>
